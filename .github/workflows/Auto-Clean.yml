name: Auto-Clean

# on:
#   #自动清理：每周日 晚上 22:00
#   schedule:
#     - cron: 0 22 * * 0
on:
  #自动编译：当Cache-Clean运行完成后
  workflow_run:
    workflows: ["QCA-6.18-VIKINGYFY"]
    types:
       - completed
  #手动清理
  workflow_dispatch:

permissions: write-all

jobs:
  auto_clean:
    runs-on: ubuntu-latest
    steps:
      - name: Delete old Releases and Workflows
        uses: ophub/delete-releases-workflows@main
        with:
          gh_token: ${{secrets.GITHUB_TOKEN}}
          delete_releases: true
          releases_keep_latest: 8
          delete_tags: true
          delete_workflows: true
          workflows_keep_day: 0
